name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
          playwright install chromium
          playwright install-deps chromium

      - name: Lint with Ruff
        run: ruff check src/ tests/

      - name: Type Check with Mypy
        run: mypy src/

      - name: Run Tests with Coverage
        run: |
          pytest --cov=src/tests --cov-report=xml tests/

  docker-build:
    runs-on: ubuntu-latest
    needs: test-and-lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t immi-crawler:latest .

      - name: Verify Docker Container Starts
        run: |
          docker run --rm immi-crawler:latest immi-crawler --help
