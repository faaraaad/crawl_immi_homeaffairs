[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "immi-crawler"
version = "0.1.0"
description = "A robust, high-performance async crawler for Australia's Skill Occupation List."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Immi Crawler Team", email = "info@example.com" }
]
dependencies = [
    "celery>=5.4.0",
    "redis>=5.0.4",
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.3",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "click>=8.1.7",
    "aiosqlite>=0.20.0",
    "aiosmtplib>=3.0.0",
    "httpx>=0.27.0",
    "alembic>=1.13.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-celery>=1.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "types-redis>=4.6.0"
]

[project.scripts]
immi-crawler = "immi_crawler.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/immi_crawler"]

[tool.mypy]
strict = true
ignore_missing_imports = true
files = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
